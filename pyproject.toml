[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alternative-neuron"
version = "0.1.0"
description = "Bounded active sensing, persistent memory, and slow transport adaptation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "anttiluode"}]

[tool.setuptools.packages.find]
include = ["alternative_neuron*"]
