name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Registered gate ladder
        run: python run_gates.py --check
      - name: Gate 5 - selective internal objects
        run: python -m experiments.gate5_selective_objects --check
      - name: Gate 5B - cost-aware cache attacker
        run: python -m experiments.gate5b_cost_aware_attacker --check
      - name: Gate 6 - world vs self attribution
        run: python -m experiments.gate6_self_world_attribution --check
      - name: Gate 6B - self/world nonidentifiability
        run: python -m experiments.gate6b_self_world_nonidentifiability --check
      - name: Gate 6C - PCA/ICA source separation
        run: python -m experiments.gate6c_blind_source_separation --check
